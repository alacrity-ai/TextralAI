name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # CF lane: runs on every push/PR. Typecheck + lint + the
  # vitest-pool-workers test suite (cf-pool, miniflare-backed).
  # No Docker services needed — the in-memory D1/R2/KV/Vectorize
  # fixtures the cf pool ships with cover everything.
  cf:
    name: cf-pool (Workers runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm exec eslint .

      - name: Placement guards (D1, CF/Node import boundaries)
        run: |
          bash tools/check-no-inline-d1.sh
          bash tools/check-no-cf-imports-in-node.sh
          bash tools/check-no-node-imports-in-cf.sh

      - name: Test (cf pool)
        run: pnpm -r test

  # Node lane: runs the Node-runtime adapter test suite against
  # real Postgres + Redis + MinIO + Qdrant services. Brings the
  # Node entrypoints (Hono node-server + ingest-consumer) under
  # CI coverage on every PR. A divergence between the two lanes
  # is a release blocker.
  node:
    name: node-runtime (self-host)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: textral
          POSTGRES_PASSWORD: textral_dev
          POSTGRES_DB: textral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U textral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: textral
          MINIO_ROOT_PASSWORD: textral_dev
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports: ['6333:6333']
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Node typecheck (Node-runtime tsconfig)
        run: pnpm --filter @textral/api typecheck:node

      - name: Apply Postgres migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: textral
          POSTGRES_PASSWORD: textral_dev
          POSTGRES_DB: textral
        run: pnpm --filter @textral/api exec tsx scripts/migrate-postgres.ts

      - name: Test (Node runtime, testcontainers + adapter unit tests)
        run: pnpm --filter @textral/api test:node

      - name: Build Node bundle (esbuild)
        run: pnpm --filter @textral/api build:node

      - name: Sandbox typecheck
        run: pnpm --filter @textral/sandbox typecheck

      - name: Sandbox build (Vite)
        run: pnpm --filter @textral/sandbox build

      - name: SDK typecheck + test
        run: |
          pnpm --filter @textral/sdk typecheck
          pnpm --filter @textral/sdk test

      - name: MCP typecheck + test
        run: |
          pnpm --filter @textral/mcp typecheck
          pnpm --filter @textral/mcp test

      - name: MCP validator typecheck
        run: pnpm --filter @textral/mcp-validator typecheck
