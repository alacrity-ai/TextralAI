# DCO (Developer Certificate of Origin) sign-off enforcement.
#
# Every non-merge commit on a pull request must include a
# `Signed-off-by:` line in the form:
#
#     Signed-off-by: Real Name <real@example.com>
#
# By adding it, the contributor certifies the DCO v1.1
# (https://developercertificate.org/) — that they have the right to
# submit the contribution under the project's license.
#
# Required-status-check setup:
#   GitHub → Settings → Branches → Branch protection rules →
#   Require status checks to pass before merging → add
#   "Verify DCO sign-off".
#
# This workflow is self-contained — no third-party Actions, no
# GitHub App install, no permissions beyond `contents: read`.

name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Verify DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head with full history
        uses: actions/checkout@v4
        with:
          # Full history so we can walk every commit between base and head.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Signed-off-by on every non-merge commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e

          missing=0
          checked=0
          while IFS= read -r sha; do
            checked=$((checked + 1))
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              author="$(git log -1 --format='%an <%ae>' "$sha")"
              subject="$(git log -1 --format=%s "$sha")"
              echo "::error ::Commit $sha is missing a Signed-off-by line."
              echo "  Author : $author"
              echo "  Subject: $subject"
              missing=$((missing + 1))
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "━━━ DCO check failed ━━━"
            echo ""
            echo "$missing commit(s) are missing a Signed-off-by line."
            echo ""
            echo "By signing off, you certify the Developer Certificate of Origin"
            echo "(https://developercertificate.org/). To fix:"
            echo ""
            echo "  # Amend the most recent commit:"
            echo "  git commit --amend --no-edit -s"
            echo "  git push --force-with-lease"
            echo ""
            echo "  # Or retroactively sign every commit on this branch:"
            echo "  git rebase --signoff origin/main"
            echo "  git push --force-with-lease"
            echo ""
            echo "  # Going forward, sign each commit as you make it:"
            echo "  git commit -s -m 'your message'"
            echo ""
            echo "See CONTRIBUTING.md for the full DCO discussion."
            exit 1
          fi

          echo "DCO ok: $checked non-merge commit(s) verified."
