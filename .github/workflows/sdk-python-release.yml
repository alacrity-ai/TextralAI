name: sdk-python-release

# Tag-driven publish to PyPI. Push a tag of the shape
# `sdk-python-v0.2.0` to trigger; the version in the tag must match
# `packages/sdk-python/src/textral/_version.py`.
#
# Auth: configure a PyPI token as the `PYPI_API_TOKEN` repo secret.
# Use a project-scoped token (Account → API tokens → "Add API
# token" → scope = textral) once the project is registered. Until
# then, an account-scoped token with name `pypi-...` works for the
# first upload that creates the project.
#
# The `manual` workflow_dispatch input lets us re-run the publish
# from the Actions tab without retagging — useful if PyPI rejects
# the upload for transient reasons.

on:
  push:
    tags:
      - 'sdk-python-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish from (e.g. sdk-python-v0.2.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi  # gates publish behind a manual approval step

    defaults:
      run:
        working-directory: packages/sdk-python

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm deps
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build @textral/contracts
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @textral/contracts build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify tag matches _version.py
        # Tag `sdk-python-v0.2.0` should agree with the version in
        # _version.py. Catches a footgun where someone bumped one but
        # not the other.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -z "$tag" ] || [ "$tag" = "$GITHUB_REF" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          tag_version="${tag#sdk-python-v}"
          file_version=$(python -c 'from textral._version import __version__; print(__version__)')
          echo "tag version : $tag_version"
          echo "file version: $file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag/_version.py mismatch — refusing to publish"
            exit 1
          fi

      - name: Regenerate models
        run: python codegen/generate.py

      - name: Run tests
        run: python -m pytest

      - name: Build
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_API_TOKEN secret not set; skipping upload"
            exit 1
          fi
          python -m twine upload dist/*
