name: sdk-python

on:
  pull_request:
    paths:
      - 'packages/sdk-python/**'
      - 'packages/contracts/**'
      - '.github/workflows/sdk-python.yml'
  push:
    branches: [main]
    paths:
      - 'packages/sdk-python/**'
      - 'packages/contracts/**'
      - '.github/workflows/sdk-python.yml'

jobs:
  test:
    name: pytest + mypy + ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    defaults:
      run:
        working-directory: packages/sdk-python

    steps:
      - uses: actions/checkout@v4

      # Build the JSON Schemas first — codegen drift check needs them
      # available, and the Python SDK depends on @textral/contracts'
      # `dist/schemas/` artifact.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm deps
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build @textral/contracts (incl. JSON Schemas)
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @textral/contracts build

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Codegen drift check
        # Regenerate models from the freshly-built schemas; fail if
        # anything would change. Catches contract drift that didn't
        # refresh the generated Pydantic models.
        run: python codegen/generate.py --check

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Mypy strict
        run: python -m mypy --strict src/textral

      - name: Pytest
        run: python -m pytest -v

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    defaults:
      run:
        working-directory: packages/sdk-python

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm deps
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build @textral/contracts
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @textral/contracts build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Regenerate models
        run: python codegen/generate.py

      - name: Build
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: textral-python-dist
          path: packages/sdk-python/dist/*
          if-no-files-found: error
          retention-days: 14
