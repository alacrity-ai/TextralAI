server {
    listen 5173;
    listen [::]:5173;

    root   /usr/share/nginx/html;
    index  index.html;

    # Reasonable defaults for a static SPA.
    sendfile on;
    tcp_nopush on;
    types_hash_bucket_size 2048;
    server_tokens off;

    # SPA fallback — react-router owns /history, /ingest, etc. Anything
    # that doesn't resolve to a file falls through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Static assets — Vite outputs hashed filenames under /assets/, so
    # they're safe to cache aggressively.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API proxy to the api service on the docker network. Same-origin
    # so the browser never sees CORS.
    location /v1 {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE — disable buffering so token events flush immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /healthz       { proxy_pass http://api:8787; }
    location /openapi.json  { proxy_pass http://api:8787; }
    location /docs          { proxy_pass http://api:8787; }
}
