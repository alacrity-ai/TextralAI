# V3 Phase 1 dev stack. Brings up Qdrant + the ingest Container
# locally so contributors can iterate without round-tripping every
# code change through deployed dev. The api Worker stays on
# `wrangler dev --remote --env dev` (run separately via
# `make dev-api-remote`).
#
# Networking: the Worker reaches Qdrant via
# `http://host.docker.internal:6333` (Wrangler dev exposes the
# host network to the Worker isolate on macOS / Windows / WSL;
# on Linux, `host.docker.internal` resolves to the docker bridge
# host with `--add-host=host.docker.internal:host-gateway` — which
# `extra_hosts` below provides for the ingest container too).

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"      # HTTP REST
      - "6334:6334"      # gRPC (reserved; unused in Phase 1)
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest:
    build:
      context: ../..
      dockerfile: apps/ingest/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Generated by `make bootstrap-secrets-dev` — carries
      # INTERNAL_HMAC_SECRET (mirrored into the deployed Worker via
      # `wrangler secret put`).
      - ../../apps/api/.secrets.dev.env
    environment:
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:-http://host.docker.internal:8787}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  qdrantdata:

networks:
  default:
    driver: bridge
