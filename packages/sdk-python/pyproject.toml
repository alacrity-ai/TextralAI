[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textral"
version = "0.2.0"
description = "Official Python client for the Textral RAG API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alacrity AI", email = "engineering@alacrity.ai" }]
requires-python = ">=3.10"
keywords = ["rag", "vector-search", "embeddings", "textral", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic[email]>=2.6,<3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "mypy>=1.8",
  "ruff>=0.4",
  "datamodel-code-generator>=0.25",
  "hatchling>=1.21",
  "build>=1.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://textral.alacrity.ai"
Documentation = "https://api.textral.alacrity.ai/docs"
Repository = "https://github.com/alacrity-ai/TextralAI"
Issues = "https://github.com/alacrity-ai/TextralAI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/textral"]

[tool.hatch.build.targets.sdist]
include = ["src/textral", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/textral", "tests"]
# Generated Pydantic models can be looser; we still want strict on
# the hand-written client surface.
[[tool.mypy.overrides]]
module = "textral.models.*"
# Auto-generated by datamodel-code-generator. Pydantic enforces
# the real schema at runtime; we keep mypy-strict on the
# hand-written client surface but skip type-juggling for the
# generator's idiomatic edge cases (default factories typed as
# empty-dict literals, etc.).
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length is enforced by ruff format separately
